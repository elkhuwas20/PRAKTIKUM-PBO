<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - KREASI</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="navbar-brand">🎓 KREASI</a>
            <a href="../index.html" class="btn btn-outline">Kembali</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px; padding: 3rem 20px;">
        <div class="card">
            <h2 class="text-center mb-4">📝 Registrasi</h2>
            
            <!-- Role Selection -->
            <div class="form-group">
                <label class="form-label">Daftar Sebagai</label>
                <select class="form-control form-select" id="role" onchange="toggleRoleFields()">
                    <option value="mahasiswa">Mahasiswa</option>
                    <option value="dosen">Dosen</option>
                </select>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <!-- Common Fields -->
                <div class="form-group">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" class="form-control" id="nama" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required minlength="6">
                    <small class="text-muted">Minimal 6 karakter</small>
                </div>

                <!-- Mahasiswa Fields -->
                <div id="mahasiswaFields">
                    <div class="form-group">
                        <label class="form-label">NIM</label>
                        <input type="text" class="form-control" id="nim" placeholder="10 digit">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Program Studi</label>
                        <select class="form-control form-select" id="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Komputer</option>
                            <option>Teknologi Informasi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Angkatan</label>
                        <input type="number" class="form-control" id="angkatan" value="2025">
                    </div>
                </div>

                <!-- Dosen Fields -->
                <div id="dosenFields" class="hidden">
                    <div class="form-group">
                        <label class="form-label">NIP</label>
                        <input type="text" class="form-control" id="nip" placeholder="18 digit">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Jurusan</label>
                        <select class="form-control form-select" id="jurusan">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Komputer</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Jabatan</label>
                        <input type="text" class="form-control" id="jabatan" placeholder="Contoh: Lektor">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Daftar
                </button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted">Sudah punya akun?</p>
                <a href="login.html" class="btn btn-secondary">Login</a>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        function toggleRoleFields() {
            const role = document.getElementById('role').value;
            document.getElementById('mahasiswaFields').classList.toggle('hidden', role !== 'mahasiswa');
            document.getElementById('dosenFields').classList.toggle('hidden', role !== 'dosen');
        }

        function handleRegister(e) {
            e.preventDefault();
            
            const role = document.getElementById('role').value;
            const userData = {
                id: generateId(),
                nama: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: role,
                keahlian: [],
                createdAt: new Date().toISOString()
            };

            if (role === 'mahasiswa') {
                userData.nim = document.getElementById('nim').value;
                userData.prodi = document.getElementById('prodi').value;
                userData.angkatan = parseInt(document.getElementById('angkatan').value);
            } else {
                userData.nip = document.getElementById('nip').value;
                userData.jurusan = document.getElementById('jurusan').value;
                userData.jabatan = document.getElementById('jabatan').value;
            }

            // Check if email exists
            if (dataManager.getUserByEmail(userData.email)) {
                showToast('Email sudah terdaftar!', 'error');
                return;
            }

            dataManager.saveUser(userData);
            showToast('Registrasi berhasil! Silakan login.', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        }
    </script>
</body>
</html>
